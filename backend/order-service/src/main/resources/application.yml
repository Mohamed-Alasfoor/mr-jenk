server:
  port: 8084
spring:
  application:
    name: order-service
  data:
    mongodb:
      uri: ${ORDER_SERVICE_MONGODB_URI:mongodb://localhost:27017/order_service_db}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info
security:
  jwt:
    secret: ${JWT_SECRET:changeit-changeit-changeit-changeit-changeit-1234567890}
services:
  product:
    base-url: ${PRODUCT_SERVICE_INTERNAL_BASE_URL:http://localhost:8082}
